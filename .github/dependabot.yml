version: 2
updates:
  # GitHub Actions used by .github/workflows, including the floating-tag
  # cmu-sei/Crucible-Github-Actions refs (bumped only if a dotted tag appears).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait before taking new releases: hijacked versions are usually caught and pulled within days.
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  # The provider's Go modules.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Wait before taking new releases: hijacked versions are usually caught and pulled within days.
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      minor-and-patch:
        # A group without patterns outranks every other group's wildcard.
        patterns: ["*"]
        update-types: [minor, patch]
