version: "3"

tasks:
  build:
    desc: Build the provider binary
    cmds:
      - go build .

  test:
    desc: Run provider unit tests (acceptance steps are skipped without TF_ACC)
    cmds:
      - go test -v ./internal/provider/...

  testacc:
    desc: |
      Run acceptance tests against a live Crucible stack. Requires TF_ACC=1 and
      the TF_* environment variables below (Player, VM and Caster APIs reachable).
      Resource-specific tests skip themselves when their TF_TEST_* id is unset.
        Provider creds : TF_PROV_NAME=crucible TF_USERNAME TF_PASSWORD TF_AUTH_URL
                         TF_TOK_URL TF_CLIENT_ID TF_CLIENT_SECRET
        Endpoints      : TF_PLAYER_API_URL TF_VM_API_URL TF_CASTER_API_URL
        Per-resource   : TF_TEST_USER_ID (player_user)
                         TF_TEST_PROJECT_ID (vlan)
                         TF_TEST_NETWORK_PROVIDER_INSTANCE_ID / TF_TEST_NETWORK_ID (view_network, optional)
        Upgrade tests  : TF_TEST_UPGRADE=1 (also needs Registry network access)
    env:
      TF_ACC: "1"
    cmds:
      - go test -v ./internal/provider/... -timeout 60m

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f terraform-provider-crucible terraform-provider-crucible.exe

  fmt:
    desc: Format Go source files
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy

  install:
    desc: Build, install, and configure Terraform to use the local provider
    cmds:
      - go install .
      - mkdir -p ~/.terraform.d
      - |
        cat > ~/.terraform.d/crucible-dev.tfrc <<EOF
        provider_installation {
          dev_overrides {
            "cmu-sei/crucible" = "$(go env GOPATH)/bin"
          }
          direct {}
        }
        EOF
      - echo "Installed provider and wrote ~/.terraform.d/crucible-dev.tfrc"
      - echo "Terraform will now use the local build. Run 'task uninstall' to revert."

  uninstall:
    desc: Remove the local provider override and binary
    cmds:
      - rm -f ~/.terraform.d/crucible-dev.tfrc
      - rm -f "$(go env GOPATH)/bin/terraform-provider-crucible"
      - echo "Removed provider override and binary."

  ci:
    desc: Run all checks (tidy, fmt, vet, test)
    cmds:
      - task: tidy
      - task: fmt
      - task: vet
      - task: test
